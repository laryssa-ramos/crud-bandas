
<mat-toolbar class="toolbar">
    <span>Crud de Bandas</span>

    <span class="spacer"></span>

    <button matButton="tonal" class="botao-sair" (click)="logout()"><mat-icon>logout</mat-icon>Sair</button>
</mat-toolbar>

<div class="formulario">

  <mat-form-field appearance="outline">
    <mat-label>Nome da banda</mat-label>
    <input matInput type="text"[(ngModel)]="nome">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Ano de formação</mat-label>
    <input matInput type="number" [(ngModel)]="ano">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>URL da imagem</mat-label>
    <input matInput  type="text"  [(ngModel)]="imagem">
  </mat-form-field>

  @if (idEditando === null) {
    <button mat-flat-button (click)="salvar()" [disabled]="!formularioValido()">
      Salvar
    </button>
  } @else {
    <button
      mat-flat-button (click)="atualizar()" [disabled]="!formularioValido()">
      Atualizar
    </button>

    <button matButton="tonal" (click)="cancelar()">
      Cancelar
    </button>
  }

</div>

<mat-table [dataSource]="bandas" class="tabela">
  <ng-container matColumnDef="nome">
    <mat-header-cell *matHeaderCellDef>Nome</mat-header-cell>
    <mat-cell *matCellDef="let banda">
      {{banda.nome}}
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="ano">
    <mat-header-cell *matHeaderCellDef>Ano de Formação</mat-header-cell>
    <mat-cell *matCellDef="let banda">
     {{banda.ano}}
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="imagem">
    <mat-header-cell *matHeaderCellDef>imagem</mat-header-cell>
    <mat-cell *matCellDef="let banda">
      <img [src]="banda.imagem" [alt]="banda.nome" class="imagem-banda">
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="acoes">
    <mat-header-cell *matHeaderCellDef>Ações</mat-header-cell>

    <mat-cell *matCellDef="let banda" class="acoes">
      <button mat-icon-button (click)="editar(banda)">
        <mat-icon>edit</mat-icon>
      </button>

       <button mat-icon-button (click)="excluir(banda.id!)"  [disabled]="idEditando !== null">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-cell>

    <mat-header-row *matHeaderRowDef="colunasExibidas"></mat-header-row>
    <mat-row *matRowDef="let row; columns: colunasExibidas"></mat-row>
  </ng-container>
 
</mat-table>
