<div class="login-container">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title class="login-title">Crud de Bandas</mat-card-title>
      <mat-card-subtitle>Acesse sua conta &#129304;</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input
          matInput
          type="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="senha"
          placeholder="Digite sua senha">
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions>
      <button
        mat-flat-button
        color="primary"
        (click)="login()"
        [disabled]="email.trim() === '' || senha.trim() === ''">
        Entrar
      </button>
    </mat-card-actions>

  </mat-card>

</div>
