<h2 mat-dialog-title>Excluir Banda</h2>

<mat-dialog-content>
    Tem certeza que deseja excluir esta banda?
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">
        Cancelar
    </button>
    <button mat-flat-button [mat-dialog-close]="true">
        Excluir
    </button>
</mat-dialog-actions>
